# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das Haus der Vierecke
description: "Ein Viereck ziehen, bis es ein anderes ist, die Vierecke nach Eigenschaften ordnen und begründen, warum ein Quadrat ein Rechteck ist."
competencies: [haus-der-vierecke]
scope: |
  Das Haus der Vierecke ordnet Vierecke nach Eigenschaften. Trapez: mindestens ein Paar paralleler Seiten.
  Parallelogramm: zwei Paare paralleler Seiten. Rechteck: Parallelogramm mit vier rechten Winkeln. Raute:
  Parallelogramm mit vier gleich langen Seiten. Quadrat: Rechteck und Raute zugleich. Drachen: zwei Paare
  benachbarter gleich langer Seiten, eine Raute ist auch ein Drachen. „A ist ein B“ gilt, wenn A alle Eigenschaften
  von B hat. Darum ist jedes Quadrat ein Rechteck: Es hat vier rechte Winkel und ist ein Parallelogramm. Das Rechteck
  ist aber kein Quadrat, wenn die Seiten verschieden lang sind. Symmetrieachsen: Parallelogramm 0, Rechteck 2, Raute 2,
  Quadrat 4, Drachen 1. Entdeckt wird im Zugmodus: Ecken C und D auf einem Gitter ziehen, Seiten, Parallelen, rechte
  Winkel und Symmetrien werden gemessen.
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Du kannst gleich Vierecke nach ihren Eigenschaften ordnen und begründen, warum ein Quadrat auch ein Rechteck
          ist.
      - type: text
        text: |
          **Selin:** Für den Schulgarten planen wir Beete in Viereckform. Ich sortiere sie.

          **Piet:** Ein Quadrat gehört doch zu den Rechtecken. Oder nicht?
      - type: single-choice
        id: rechte-winkel
        text: Wie viele rechte Winkel hat ein Rechteck?
        options:
          - text: zwei
            correct: false
            info: Bei zwei rechten Winkeln könnten die anderen beiden noch schief sein. Beim Rechteck sind alle vier rechte Winkel.
          - text: vier
            correct: true
            info: Alle Ecken eines Rechtecks sind rechte Winkel.
          - text: keinen
            correct: false
            info: Ein Rechteck hat in jeder Ecke einen rechten Winkel.
        explanation: Ein Rechteck hat vier rechte Winkel.
  - type: section
    id: entdecken
    title: Das Viereck ziehen
    blocks:
      - type: text
        text: "Wenn du wissen willst, welche Vierecke zusammengehören, probierst du aus, welche Eigenschaften du mit C und D einstellen kannst."
      - type: text
        text: |
          Die Ecken *A* und *B* bleiben liegen. Du ziehst *C* und *D* von Gitterpunkt zu Gitterpunkt, zwischen zwei Punkten liegt 1 cm. Mit der
          Tastatur wählst du eine Ecke mit der Tabulatortaste und bewegst sie mit den Pfeiltasten. Stelle der Reihe nach
          ein: zwei Paare paralleler Seiten, vier rechte Winkel, vier gleich lange Seiten, und dann alles zugleich.
          Lies jedes Mal unter dem Bild ab, was sich ändert.
      - type: vue-component
        id: zug-viereck
        component: Viereckszug
        props:
          handleC: "Ecke C, mit den Pfeiltasten ziehen"
          handleD: "Ecke D, mit den Pfeiltasten ziehen"
          measure: "Seiten: {seiten} · parallele Seitenpaare: {parallel} · rechte Winkel: {recht} · Symmetrieachsen: {achsen} · punktsymmetrisch: {punkt}"
          notConvex: "Hier kreuzen sich Seiten oder eine Ecke zeigt nach innen. Es entsteht kein Viereck ABCD. Ziehe C oder D an eine andere Stelle."
          yes: ja
          no: nein
          reset: Ecken zurück auf den Start
          atStart: Die Figur steht am Start.
        nojs: |
          Ein Viereck *ABCD* auf einem Gitter, *A* = (0 | 0) und *B* = (5 | 0). Drei Stellungen von *C* und *D*:
          *C* = (5 | 5), *D* = (0 | 5): alle Seiten 5 cm, zwei parallele Seitenpaare, vier rechte Winkel, vier
          Symmetrieachsen, punktsymmetrisch. *C* = (5 | 3), *D* = (0 | 3): Seiten 5 cm, 3 cm, 5 cm, 3 cm, zwei parallele
          Seitenpaare, vier rechte Winkel, zwei Achsen, punktsymmetrisch. *C* = (8 | 4), *D* = (3 | 4): alle Seiten 5 cm,
          zwei parallele Seitenpaare, kein rechter Winkel, zwei Achsen, punktsymmetrisch.
  - type: section
    id: vermutung
    title: Was gehört zu was?
    blocks:
      - type: text
        text: "Wenn du an der Figur etwas entdeckt hast, hältst du es als Vermutung fest und prüfst sie dann."
      - type: true-false
        id: quadrat-ist-rechteck
        text: Jedes Quadrat ist ein Rechteck.
        answer: true
        explanation: Wenn du vier rechte Winkel einstellst, ist die Figur ein Rechteck, auch bei vier gleich langen Seiten. Das ist erst eine Vermutung. Gleich begründest du sie.
  - type: section
    id: warum
    title: Warum ist das so?
    blocks:
      - type: text
        text: "Wenn du begründen willst, warum ein Quadrat ein Rechteck ist, vergleichst du, was jedes Viereck mindestens haben muss."
      - type: text
        text: |
          „*A* ist ein *B*“ gilt, wenn *A* alle Eigenschaften von *B* hat. Ein Rechteck ist ein Parallelogramm mit vier
          rechten Winkeln. Ein Quadrat hat zwei Paare paralleler Seiten und vier rechte Winkel, dazu vier gleich lange
          Seiten. Es hat also alles, was ein Rechteck braucht.
      - type: figure
        image: images/haus-der-vierecke.svg
        source: eigene Zeichnung
        licence: CC0-1.0
        alt: Das Haus der Vierecke als Pfeildiagramm. Ganz oben steht Viereck. Darunter stehen Trapez und Drachen. Unter dem Trapez steht Parallelogramm. Darunter stehen Rechteck und Raute, beide haben einen Pfeil zum Parallelogramm. Die Raute hat auch einen Pfeil zum Drachen. Ganz unten steht Quadrat mit Pfeilen zum Rechteck und zur Raute.
        caption: Jeder Pfeil heißt „ist ein“. Folge den Pfeilen vom Quadrat nach oben.
      - type: text
        text: |
          Beim Quadrat gibt es zwei Wege nach oben, über das Rechteck und über die Raute. Darum ist jedes Quadrat ein
          Rechteck und auch eine Raute.
  - type: section
    id: merke
    title: Merke
    blocks:
      - type: text
        text: "Wenn du den Satz später wieder brauchst, findest du ihn hier kurz zusammengefasst."
      - type: table
        caption: Eigenschaften im Haus der Vierecke
        header: [Viereck, Eigenschaft]
        rows:
          - [Trapez, mindestens ein Paar paralleler Seiten]
          - [Parallelogramm, zwei Paare paralleler Seiten]
          - [Rechteck, Parallelogramm mit vier rechten Winkeln]
          - [Raute, Parallelogramm mit vier gleich langen Seiten]
          - [Quadrat, Rechteck und Raute zugleich]
          - [Drachen, zwei Paare benachbarter gleich langer Seiten]
      - type: note
        title: Achtung
        blocks:
          - type: text
            text: Der Pfeil gilt nur in eine Richtung. Jedes Quadrat ist ein Rechteck, aber nicht jedes Rechteck ist ein Quadrat.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: text
        text: "Wenn du prüfen willst, ob du das anwenden kannst, löst du Aufgaben mit neuen Zahlen und neuen Fällen."
      - type: true-false
        id: rechteck-ist-quadrat
        text: Jedes Rechteck ist ein Quadrat.
        answer: false
        explanation: Ein Rechteck mit den Seiten 5 cm und 3 cm hat vier rechte Winkel, aber nicht vier gleich lange Seiten.
      - type: true-false
        id: raute-ist-drachen
        text: Jede Raute ist ein Drachen.
        answer: true
        explanation: Eine Raute hat vier gleich lange Seiten, also auch zwei Paare benachbarter gleich langer Seiten.
      - type: multiple-choice
        id: immer-parallelogramm
        text: Welche Vierecke sind immer Parallelogramme?
        options:
          - text: Rechteck
            correct: true
            info: Ein Rechteck hat zwei Paare paralleler Seiten.
          - text: Raute
            correct: true
            info: Eine Raute ist ein Parallelogramm mit vier gleich langen Seiten.
          - text: Quadrat
            correct: true
            info: Ein Quadrat ist ein Rechteck und eine Raute, also ein Parallelogramm.
          - text: Drachen
            correct: false
            info: Ein Drachen muss keine parallelen Seiten haben.
          - text: Trapez
            correct: false
            info: Ein Trapez muss nur ein Paar paralleler Seiten haben, ein Parallelogramm hat immer zwei.
        explanation: Rechteck, Raute und Quadrat haben zwei Paare paralleler Seiten.
      - type: matching
        id: eigenschaft-zuordnen
        text: Ordne jedem Viereck die Beschreibung zu, die es genau kennzeichnet.
        pairs:
          - left: Rechteck
            right: Parallelogramm mit vier rechten Winkeln
          - left: Raute
            right: Parallelogramm mit vier gleich langen Seiten
          - left: Drachen
            right: zwei Paare benachbarter gleich langer Seiten
        explanation: Jede Beschreibung nennt, was dieses Viereck vom Parallelogramm oder Viereck unterscheidet.
      - type: generated
        id: achsen-zaehlen
        given:
          v: { pick: 1, from: { data: vierecke } }
        task:
          text: "Ein Viereck hat diese Eigenschaften: {{v.eigenschaft}}. Wie viele Symmetrieachsen hat es?"
        answer: { value: "v.achsen", compare: { number: { format: integer } } }
        mistakes:
          - value: "v.achsen + 1"
            message: "Prüfe jede Achse einzeln: Eine Achse spiegelt das Viereck genau auf sich selbst."
        hint: "Welches Viereck hat diese Eigenschaften? Zähle dann die Linien, an denen es sich auf sich selbst spiegeln lässt."
        steps:
          - "Die Eigenschaften gehören zum Viereck {{v.name}}. Es hat {{answer}} Symmetrieachsen."
  - type: section
    id: begruendung
    title: Begründe in eigenen Worten
    blocks:
      - type: text
        text: "Wenn du einen Satz wirklich verstanden hast, kannst du ihn mit eigenen Worten begründen."
      - type: open-task
        id: quadrat-rechteck-begruenden
        task: Erkläre in zwei bis vier Sätzen, warum jedes Quadrat ein Rechteck ist.
        points:
          - text: Ein Rechteck ist ein Parallelogramm mit vier rechten Winkeln.
            source: /haus/haus-der-vierecke/#merke
          - text: Ein Quadrat hat vier rechte Winkel und zwei Paare paralleler Seiten.
            source: /haus/haus-der-vierecke/#warum
          - text: Ein Quadrat hat alle Eigenschaften eines Rechtecks (und noch eine mehr), darum ist es ein Rechteck.
            source: /haus/haus-der-vierecke/#warum
          - text: Ganze Sätze mit einer Begründung (weil …, darum …).
            kind: form
        solution: |
          Ein Rechteck ist ein Viereck mit vier rechten Winkeln und zwei Paaren paralleler Seiten. Ein Quadrat hat vier
          rechte Winkel und zwei Paare paralleler Seiten. Es hat also alles, was ein Rechteck braucht, und dazu vier
          gleich lange Seiten. Darum ist jedes Quadrat ein Rechteck.
  - type: section
    id: rueckblick
    title: Rückblick
    blocks:
      - type: text
        text: |
          Du hast ein Viereck gezogen, bis es ein anderes war. Du kannst Vierecke nach Eigenschaften ordnen. Du kannst
          mit „ist ein“ begründen, warum ein Quadrat ein Rechteck ist.
