# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
recap: [mathematik/vierecke-grundfiguren, mathematik/symmetrie]
scope: |
  Wiederholung ohne Aufgaben für das Kapitel „Das Haus der Vierecke“. Besondere Vierecke: parallele Seiten, rechter Winkel,
  Quadrat, Rechteck, Raute, Parallelogramm, Trapez und Drachen mit ihren Eigenschaften. Symmetrie: Symmetrieachse und
  Punktsymmetrie. Dazu ein Selbsttest mit Rückmeldung je Baustein und die Checkliste, wann Lernende bereit sind.
blocks:
  - type: text
    text: |
      **Das brauchst du für dieses Kapitel.** Im Haus der Vierecke ordnest du Vierecke nach ihren Eigenschaften. Dafür musst
      du zwei Dinge schon können: die besonderen Vierecke und die Symmetrie. Lies die Begriffe, mach die Kurztests und
      prüfe am Ende die Checkliste.
  - type: section
    id: besondere-vierecke
    title: Besondere Vierecke
    blocks:
      - type: text
        text: Ein Viereck hat vier Ecken, vier Seiten und vier Winkel. Für die besonderen Vierecke brauchst du zwei Begriffe.
      - type: definition
        term: Parallel
        explanation: "Zwei Geraden oder Seiten sind parallel, wenn sie überall denselben Abstand haben und sich nie schneiden. Beispiel: Die gegenüberliegenden Seiten eines Rechtecks mit 5 cm Länge und 3 cm Breite sind je 3 cm oder 5 cm voneinander entfernt."
      - type: definition
        term: Rechter Winkel
        explanation: "Ein Winkel mit 90°, wie die Ecke eines Geodreiecks. Beispiel: Jede Ecke eines Rechtecks ist ein rechter Winkel."
      - type: example
        title: Die sechs besonderen Vierecke
        blocks:
          - type: table
            caption: Besondere Vierecke mit Beispielen
            header: [Viereck, Das gilt, Beispiel]
            rows:
              - [Quadrat, "vier gleich lange Seiten und vier rechte Winkel", "Seiten 4 cm"]
              - [Rechteck, "vier rechte Winkel, gegenüberliegende Seiten gleich lang", "5 cm und 3 cm"]
              - [Raute, "vier gleich lange Seiten, gegenüberliegende Seiten parallel", "Seiten 4 cm"]
              - [Parallelogramm, "zwei Paare paralleler Seiten", "Seiten 6 cm und 3 cm"]
              - [Trapez, "mindestens ein Paar paralleler Seiten", "Seiten 6 cm und 4 cm parallel"]
              - [Drachen, "zwei Paare benachbarter gleich langer Seiten", "Seiten 5 cm und 3 cm"]
      - type: vue-component
        id: test-vierecke
        component: Kurztest
        props:
          question: Welches Viereck hat vier gleich lange Seiten, aber keine rechten Winkel?
          options:
            - { text: "Quadrat", correct: false, info: "Ein Quadrat hat vier rechte Winkel." }
            - {
                text: Rechteck,
                correct: false,
                info: "Ein Rechteck hat vier rechte Winkel, aber nur gegenüberliegende Seiten gleich lang.",
              }
            - { text: "Raute", correct: true, info: "Alle Seiten gleich lang, die Winkel sind schief." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welches Viereck hat vier gleich lange Seiten, aber keine rechten Winkel? Quadrat, Rechteck oder Raute. Antwort:
          die Raute. Ein Quadrat hat vier rechte Winkel, ein Rechteck hat nur gegenüberliegende Seiten gleich lang.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Besondere Vierecke** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/vierecke-grundfiguren/) nach."
  - type: section
    id: symmetrie
    title: Symmetrie
    blocks:
      - type: definition
        term: Symmetrieachse
        explanation: "Eine Gerade, an der du die Figur spiegeln kannst, sodass sie genau auf sich selbst fällt. Beispiel: Ein Rechteck mit den Seiten 5 cm und 3 cm hat zwei Symmetrieachsen, die Mittellinien durch die Seitenmitten."
      - type: definition
        term: Punktsymmetrie
        explanation: "Eine Figur ist punktsymmetrisch, wenn sie nach einer halben Drehung (180°) um einen Punkt genau auf sich selbst fällt. Beispiel: Ein Parallelogramm dreht sich um den Schnittpunkt seiner Diagonalen auf sich selbst."
      - type: vue-component
        id: test-symmetrie
        component: Kurztest
        props:
          question: Wie viele Symmetrieachsen hat ein Rechteck mit den Seiten 5 cm und 3 cm?
          options:
            - { text: "keine", correct: false, info: "Du kannst das Rechteck an den Mittellinien spiegeln." }
            - {
                text: zwei,
                correct: true,
                info: "Eine Achse geht durch die Mitten der langen Seiten, die andere durch die Mitten der kurzen Seiten.",
              }
            - {
                text: vier,
                correct: false,
                info: "Vier Achsen hat nur das Quadrat, weil bei ihm auch die Diagonalen Achsen sind.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie viele Symmetrieachsen hat ein Rechteck mit den Seiten 5 cm und 3 cm? Keine, zwei oder vier. Antwort: zwei,
          die Mittellinien durch die Seitenmitten. Vier hat nur das Quadrat.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Symmetrie** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/symmetrie/) nach."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - **Besondere Vierecke:** Du kannst besondere Vierecke mit ihren Eigenschaften beschreiben und unterscheiden.
          - **Symmetrie:** Du kannst Achsen-, Punkt- und Drehsymmetrie bei Figuren erkennen und nutzen.
