# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
recap: [mathematik/vierecke-grundfiguren, mathematik/symmetrie]
scope: |
  Wiederholung ohne Aufgaben für das Kapitel „Das Haus der Vierecke“. Besondere Vierecke: parallele Seiten, rechter Winkel,
  Quadrat, Rechteck, Raute, Parallelogramm, Trapez und Drachen mit ihren Eigenschaften. Symmetrie: Symmetrieachse und
  Punktsymmetrie. Dazu ein Selbsttest mit Rückmeldung je Baustein und die Checkliste, wann Lernende bereit sind.
blocks:
  - type: text
    text: |
      **Das brauchst du für dieses Kapitel.** Im Haus der Vierecke ordnest du Vierecke nach ihren Eigenschaften. Dafür musst
      du zwei Dinge schon können: die besonderen Vierecke und die Symmetrie. Lies die Begriffe, mach die Kurztests und
      prüfe am Ende die Checkliste.
  - type: section
    id: besondere-vierecke
    title: Besondere Vierecke
    blocks:
      - type: text
        text: Ein Viereck hat vier Ecken, vier Seiten und vier Winkel. Für die besonderen Vierecke brauchst du zwei Begriffe.
      - type: definition
        term: Parallel
        explanation: "Zwei Geraden oder Seiten sind parallel, wenn sie überall denselben Abstand haben und sich nie schneiden. Beispiel: Die lange Seite eines Rechtecks hat zur gegenüberliegenden Seite überall 3 cm Abstand."
      - type: definition
        term: Rechter Winkel
        explanation: "Ein Winkel mit 90°, wie die Ecke eines Geodreiecks. Beispiel: Jede Ecke eines Rechtecks ist ein rechter Winkel."
      - type: definition
        term: Benachbart und gegenüberliegend
        explanation: "Zwei Seiten sind benachbart, wenn sie an einer Ecke zusammenstoßen, und gegenüberliegend, wenn sie keine Ecke gemeinsam haben. Beispiel: Beim Rechteck ABCD sind AB und BC benachbart, AB und CD gegenüberliegend."
      - type: definition
        term: Diagonale
        explanation: "Eine Strecke zwischen zwei gegenüberliegenden Ecken eines Vierecks. Beispiel: Ein Rechteck hat zwei Diagonalen, von A nach C und von B nach D."
      - type: example
        title: Die sechs besonderen Vierecke
        blocks:
          - type: table
            caption: Besondere Vierecke mit je einem Beispiel
            header: [Viereck, "Das gilt (Beispiel)"]
            rows:
              - [Quadrat, "vier gleich lange Seiten und vier rechte Winkel, z. B. alle Seiten 4 cm"]
              - [Rechteck, "vier rechte Winkel, gegenüberliegende Seiten parallel und gleich lang, z. B. 5 cm und 3 cm"]
              - [Raute, "vier gleich lange Seiten, gegenüberliegende Seiten parallel, z. B. alle Seiten 4 cm"]
              - [Parallelogramm, "zwei Paare paralleler Seiten, z. B. Seiten 6 cm und 3 cm"]
              - [Trapez, "mindestens ein Paar paralleler Seiten, z. B. 6 cm und 4 cm parallel"]
              - [Drachen, "zwei Paare benachbarter gleich langer Seiten, z. B. 5 cm, 5 cm, 3 cm, 3 cm"]
      - type: vue-component
        id: test-vierecke
        component: Kurztest
        props:
          question: Welches Viereck hat vier gleich lange Seiten, aber keine rechten Winkel?
          options:
            - { text: "Quadrat", correct: false, info: "Ein Quadrat hat vier rechte Winkel." }
            - {
                text: Rechteck,
                correct: false,
                info: "Ein Rechteck hat vier rechte Winkel, aber nur gegenüberliegende Seiten gleich lang.",
              }
            - {
                text: "Raute",
                correct: true,
                info: "Eine Raute hat vier gleich lange Seiten. Sind die Winkel nicht 90°, ist sie kein Quadrat.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welches Viereck hat vier gleich lange Seiten, aber keine rechten Winkel? Quadrat, Rechteck oder Raute. Antwort:
          die Raute. Ein Quadrat hat vier rechte Winkel, ein Rechteck hat nur gegenüberliegende Seiten gleich lang.
      - type: vue-component
        id: test-trapez
        component: Kurztest
        props:
          question: Ein Viereck hat genau ein Paar paralleler Seiten. Was kann es sein?
          options:
            - { text: "Trapez", correct: true, info: "Ein Trapez braucht mindestens ein Paar paralleler Seiten." }
            - { text: "Parallelogramm", correct: false, info: "Ein Parallelogramm hat zwei Paare paralleler Seiten." }
            - { text: "Rechteck", correct: false, info: "Ein Rechteck hat zwei Paare paralleler Seiten." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Viereck hat genau ein Paar paralleler Seiten. Was kann es sein? Trapez, Parallelogramm oder Rechteck. Antwort:
          Trapez. Parallelogramm und Rechteck haben zwei Paare paralleler Seiten.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Besondere Vierecke** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/vierecke-grundfiguren/) nach."
  - type: section
    id: symmetrie
    title: Symmetrie
    blocks:
      - type: definition
        term: Symmetrieachse
        explanation: "Eine Gerade, an der du die Figur spiegeln kannst, sodass sie genau auf sich selbst fällt. Beispiel: Ein Rechteck mit den Seiten 5 cm und 3 cm hat zwei Symmetrieachsen, die Mittellinien durch die Seitenmitten."
      - type: definition
        term: Punktsymmetrie
        explanation: "Eine Figur ist punktsymmetrisch, wenn sie nach einer halben Drehung (180°) um einen Punkt genau auf sich selbst fällt. Beispiel: Ein Parallelogramm dreht sich um den Schnittpunkt seiner Diagonalen auf sich selbst."
      - type: definition
        term: Drehsymmetrie
        explanation: "Eine Figur ist drehsymmetrisch, wenn sie nach einer Drehung um einen Punkt um weniger als 360° auf sich selbst fällt. Beispiel: Ein Quadrat fällt nach 90° auf sich selbst."
      - type: vue-component
        id: test-symmetrie
        component: Kurztest
        props:
          question: Wie viele Symmetrieachsen hat ein Rechteck mit den Seiten 5 cm und 3 cm?
          options:
            - { text: "keine", correct: false, info: "Du kannst das Rechteck an den Mittellinien spiegeln." }
            - {
                text: zwei,
                correct: true,
                info: "Eine Achse geht durch die Mitten der langen Seiten, die andere durch die Mitten der kurzen Seiten.",
              }
            - {
                text: vier,
                correct: false,
                info: "Unter den besonderen Vierecken hat nur das Quadrat vier Achsen, weil bei ihm auch die Diagonalen Achsen sind.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie viele Symmetrieachsen hat ein Rechteck mit den Seiten 5 cm und 3 cm? Keine, zwei oder vier. Antwort: zwei,
          die Mittellinien durch die Seitenmitten. Vier hat nur das Quadrat.
      - type: vue-component
        id: test-punktsymmetrie
        component: Kurztest
        props:
          question: Welches Viereck ist immer punktsymmetrisch?
          options:
            - {
                text: Parallelogramm,
                correct: true,
                info: "Nach einer halben Drehung um den Schnittpunkt der Diagonalen fällt es auf sich selbst.",
              }
            - {
                text: Trapez,
                correct: false,
                info: "Ein Trapez ohne zwei Paare paralleler Seiten fällt nach einer halben Drehung nicht auf sich selbst.",
              }
            - {
                text: Drachen,
                correct: false,
                info: "Ein Drachen, der keine Raute ist, fällt nach einer halben Drehung nicht auf sich selbst.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welches Viereck ist immer punktsymmetrisch? Parallelogramm, Trapez oder Drachen. Antwort: Parallelogramm. Nach einer
          halben Drehung um den Schnittpunkt der Diagonalen fällt es auf sich selbst.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Symmetrie** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/symmetrie/) nach."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - **Besondere Vierecke:** Du kannst die sechs Vierecke an ihren Eigenschaften unterscheiden, zum Beispiel ein Trapez von einem Parallelogramm.
          - **Symmetrie:** Du kannst Symmetrieachsen zählen und sagen, ob eine Figur punkt- oder drehsymmetrisch ist.
