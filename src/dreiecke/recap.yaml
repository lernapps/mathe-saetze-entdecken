# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
recap: [mathematik/konstruktionen, mathematik/winkel-messen, mathematik/bewegungen-figuren]
scope: |
  Wiederholung ohne Aufgaben für das Kapitel „Dreiecke konstruieren und vergleichen“. Zeichnen und Konstruieren: Strecke
  abtragen, Winkel antragen, Kreis mit dem Zirkel schlagen. Winkel messen und zeichnen: Winkel mit dem Geodreieck messen und
  zeichnen. Spiegeln, Verschieben, Drehen: die drei Bewegungen, Bildfigur, Länge und Winkel bleiben gleich. Dazu ein Selbsttest
  mit Rückmeldung je Baustein und die Checkliste.
blocks:
  - type: text
    text: |
      **Das brauchst du für dieses Kapitel.** Du konstruierst Dreiecke und vergleichst sie. Dafür musst du drei Dinge schon
      können: konstruieren, Winkel messen und die drei Bewegungen von Figuren. Lies die Begriffe, mach die Kurztests und prüfe
      am Ende die Checkliste.
  - type: section
    id: konstruktionen
    title: Zeichnen und Konstruieren
    blocks:
      - type: definition
        term: Abtragen
        explanation: "Eine Strecke von bestimmter Länge von einem Punkt aus auf einer Linie markieren, mit dem Zirkel oder dem Lineal. Beispiel: Von A aus 6 cm abtragen, du erhältst den Punkt B."
      - type: definition
        term: Antragen
        explanation: "Einen Winkel von bestimmter Größe an eine Strecke zeichnen, mit dem Geodreieck am Punkt der Strecke. Beispiel: An die Strecke AB bei A einen Winkel von 50° antragen."
      - type: text
        text: "Mit dem **Zirkel** schlägst du einen Kreis um einen Punkt mit einem festen Radius. Der Schnittpunkt zweier solcher Kreise hat von beiden Mittelpunkten einen festen Abstand. Beispiel: Kreise mit Radius 4 cm um A und 5 cm um B schneiden sich in Punkten, die 4 cm von A und 5 cm von B entfernt sind. Zwei Linien stehen **senkrecht**, wenn sie einen rechten Winkel (90°) bilden. Die **Mitte einer Strecke** teilt sie in zwei gleich lange Teile: Bei 8 cm ist sie 4 cm von jedem Ende entfernt. Du findest sie, indem du misst, halbierst und abträgst."
      - type: vue-component
        id: test-antragen
        component: Kurztest
        props:
          question: Du sollst bei A an die Strecke AB einen Winkel von 50° zeichnen. Wie heißt das?
          options:
            - { text: "abtragen", correct: false, info: "Abtragen bedeutet, eine Länge zu markieren." }
            - { text: "antragen", correct: true, info: "Einen Winkel an eine Strecke zeichnen heißt antragen." }
            - { text: "spiegeln", correct: false, info: "Spiegeln heißt, eine Figur an einer Achse umzuklappen." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Du sollst bei A an die Strecke AB einen Winkel von 50° zeichnen. Wie heißt das? Abtragen, antragen oder spiegeln.
          Antwort: antragen. Abtragen markiert eine Länge.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Zeichnen und Konstruieren** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/konstruktionen/) nach."
  - type: section
    id: winkel-messen
    title: Winkel messen und zeichnen
    blocks:
      - type: text
        text: |
          Du misst einen **Winkel** mit dem Geodreieck. Der Scheitel ist die Ecke des Winkels, die Schenkel sind seine beiden Linien. Lege
          die Mitte der Grundkante auf den Scheitel und den Nullstrich auf einen Schenkel, dann liest du am anderen Schenkel die
          Größe in Grad (°) ab. Beispiel: Ein Winkel von 40° ist ein spitzer Winkel. Beim Zeichnen gehst du umgekehrt vor: Du trägst
          die Gradzahl an.
      - type: vue-component
        id: test-winkel-messen
        component: Kurztest
        props:
          question: "Der Nullstrich liegt auf einem Schenkel. Am anderen Schenkel liest du auf den zwei Skalen 65° und 115° ab. Der Winkel sieht spitz aus. Welcher Wert gehört zum Winkel?"
          options:
            - { text: "65°", correct: true, info: "Ein spitzer Winkel ist kleiner als 90°." }
            - { text: "115°", correct: false, info: "115° wäre ein stumpfer Winkel, größer als 90°." }
            - { text: "90°", correct: false, info: "90° steht auf keiner der beiden Skalen, die du abgelesen hast." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Der Nullstrich liegt auf einem Schenkel. Am anderen Schenkel liest du auf den zwei Skalen 65° und 115° ab. Der Winkel sieht spitz aus. Welcher Wert gehört zum Winkel? Antwort: 65°, denn ein spitzer Winkel ist kleiner als 90°.
      - type: vue-component
        id: test-skala
        component: Kurztest
        props:
          question: Ein Winkel sieht größer aus als ein rechter. Du liest an den zwei Skalen 50° und 130° ab. Welcher Wert gehört zum Winkel?
          options:
            - {
                text: "50°",
                correct: false,
                info: "50° wäre ein spitzer Winkel. Der Winkel ist aber größer als ein rechter.",
              }
            - { text: "130°", correct: true, info: "Der Winkel ist stumpf, also größer als 90°." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Winkel sieht größer aus als ein rechter. Du liest an den zwei Skalen 50° und 130° ab. Welcher Wert gehört zum
          Winkel? Antwort: 130°, denn der Winkel ist stumpf, also größer als 90°.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Winkel messen und zeichnen** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/winkel-messen/) nach."
  - type: section
    id: bewegungen
    title: Spiegeln, Verschieben, Drehen
    blocks:
      - type: definition
        term: Spiegeln
        explanation: "Eine Figur an einer Geraden, der Spiegelachse, umklappen. Die Achse halbiert jede Strecke zwischen einem Punkt und seinem Bildpunkt senkrecht, beide liegen im gleichen Abstand auf verschiedenen Seiten. Beispiel: Ein Punkt 2 cm links der Achse hat seinen Bildpunkt 2 cm rechts."
      - type: definition
        term: Verschieben
        explanation: "Eine Figur ohne Drehen um dieselbe Strecke in dieselbe Richtung bewegen. Beispiel: Alle Punkte 3 cm nach rechts."
      - type: definition
        term: Drehen
        explanation: "Eine Figur um einen Punkt, das Drehzentrum Z, um einen Winkel drehen, zum Beispiel um 90° gegen den Uhrzeigersinn."
      - type: definition
        term: Bildfigur
        explanation: "Die Figur, die nach dem Spiegeln, Verschieben oder Drehen entsteht. Bei diesen drei Bewegungen bleiben alle Längen und Winkel gleich. Beispiel: Ein Dreieck mit den Seiten 3 cm, 4 cm und 5 cm hat als Bildfigur wieder ein Dreieck mit 3 cm, 4 cm und 5 cm."
      - type: vue-component
        id: test-bewegungen
        component: Kurztest
        props:
          question: Ein Dreieck mit den Seiten 3 cm, 4 cm und 5 cm wird um 6 cm nach rechts verschoben. Wie lang sind die Seiten der Bildfigur?
          options:
            - { text: "3 cm, 4 cm und 5 cm", correct: true, info: "Beim Verschieben bleiben alle Längen gleich." }
            - {
                text: "9 cm, 10 cm und 11 cm",
                correct: false,
                info: "Du hast 6 cm zu jeder Seite addiert. Die Verschiebung bewegt die Figur, sie verlängert nichts.",
              }
            - {
                text: "6 cm, 8 cm und 10 cm",
                correct: false,
                info: "So wäre das Dreieck doppelt so groß geworden. Verschieben ändert die Größe nicht.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Dreieck mit den Seiten 3 cm, 4 cm und 5 cm wird um 6 cm nach rechts verschoben. Wie lang sind die Seiten der
          Bildfigur? Antwort: 3 cm, 4 cm und 5 cm. Beim Verschieben bleiben alle Längen gleich.
      - type: vue-component
        id: test-spiegeln
        component: Kurztest
        props:
          question: "Ein Punkt hat 3 cm Abstand zur Spiegelachse. Wie weit sind der Punkt und sein Bildpunkt voneinander entfernt?"
          options:
            - {
                text: "3 cm",
                correct: false,
                info: "Das ist nur der Abstand bis zur Achse. Der Bildpunkt liegt noch einmal so weit auf der anderen Seite.",
              }
            - { text: "6 cm", correct: true, info: "3 cm bis zur Achse und 3 cm von der Achse zum Bildpunkt." }
            - { text: "9 cm", correct: false, info: "Der Bildpunkt hat denselben Abstand, nicht den dreifachen." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Punkt hat 3 cm Abstand zur Spiegelachse. Wie weit sind der Punkt und sein Bildpunkt voneinander entfernt? 3 cm, 6 cm oder 9 cm. Antwort: 6 cm, denn der Bildpunkt hat auf der anderen Seite denselben Abstand.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Spiegeln, Verschieben, Drehen** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/bewegungen-figuren/) nach."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - **Zeichnen und Konstruieren:** Du kannst eine Strecke abtragen, einen Winkel antragen und mit dem Zirkel einen Kreis schlagen.
          - **Winkel messen und zeichnen:** Du kannst einen Winkel messen und zeichnen und dabei die richtige Skala wählen.
          - **Spiegeln, Verschieben, Drehen:** Du kannst sagen, wo der Bildpunkt liegt, und weißt, dass Längen und Winkel gleich bleiben.
