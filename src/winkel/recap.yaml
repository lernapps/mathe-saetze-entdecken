# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
recap: [mathematik/winkel-messen, mathematik/grundfiguren-eben, mathematik/konstruktionen]
scope: |
  Wiederholung ohne Aufgaben für das Kapitel „Winkelsätze und der Satz des Thales“. Winkel messen und zeichnen: Winkel,
  Schenkel, Scheitel, spitzer, stumpfer und gestreckter Winkel, rechter Winkel als 90°. Ebene Grundfiguren: Dreieck, gleichschenkliges Dreieck
  mit Basiswinkeln, Kreis mit Mittelpunkt, Radius und Durchmesser. Zeichnen und Konstruieren: parallel, senkrecht, Lot, Mitte
  einer Strecke, Zirkel und Geodreieck. Dazu ein Selbsttest mit Rückmeldung je Baustein und die Checkliste.
blocks:
  - type: text
    text: |
      **Das brauchst du für dieses Kapitel.** Du berechnest Winkel, arbeitest am Kreis und konstruierst. Dafür musst du drei
      Dinge schon können: Winkel messen, die ebenen Grundfiguren und das Zeichnen mit Geodreieck und Zirkel. Lies die
      Begriffe, mach die Kurztests und prüfe am Ende die Checkliste.
  - type: section
    id: winkel-messen
    title: Winkel messen und zeichnen
    blocks:
      - type: definition
        term: Winkel
        explanation: "Ein Winkel entsteht, wenn zwei Strahlen von einem Punkt ausgehen. Der Punkt heißt Scheitel, die Strahlen heißen Schenkel. Du misst ihn in Grad (°). Beispiel: Die Ecke einer Buchseite ist ein Winkel von 90°."
      - type: definition
        term: Spitzer Winkel
        explanation: "Ein Winkel kleiner als 90°. Beispiel: 35°."
      - type: definition
        term: Stumpfer Winkel
        explanation: "Ein Winkel zwischen 90° und 180°. Beispiel: 120°."
      - type: definition
        term: Gestreckter Winkel
        explanation: "Ein Winkel von 180°: Die beiden Schenkel bilden eine gerade Linie. Beispiel: Die Schenkel liegen auf einer Geraden, wie ein ausgestreckter Arm."
      - type: text
        text: "Ein **rechter Winkel** hat 90°, wie die Ecke eines Geodreiecks. Du misst einen Winkel mit dem Geodreieck: Der Nullstrich liegt auf einem Schenkel, die Mitte der Grundkante auf dem Scheitel, am anderen Schenkel liest du ab."
      - type: vue-component
        id: test-winkel
        component: Kurztest
        props:
          question: Ein Winkel misst 120°. Was für ein Winkel ist das?
          options:
            - { text: "spitz", correct: false, info: "Spitz ist kleiner als 90°." }
            - { text: "rechter Winkel", correct: false, info: "Ein rechter Winkel hat genau 90°." }
            - { text: "stumpf", correct: true, info: "120° liegt zwischen 90° und 180°." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Winkel misst 120°. Was für ein Winkel ist das? Spitz, rechter Winkel oder stumpf. Antwort: stumpf, denn
          120° liegt zwischen 90° und 180°.
      - type: vue-component
        id: test-skala
        component: Kurztest
        props:
          question: Ein Winkel sieht größer aus als ein rechter. Du liest an den zwei Skalen 50° und 130° ab. Welcher Wert gehört zum Winkel?
          options:
            - {
                text: "50°",
                correct: false,
                info: "50° wäre ein spitzer Winkel. Der Winkel ist aber größer als ein rechter.",
              }
            - { text: "130°", correct: true, info: "Der Winkel ist stumpf, also größer als 90°." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Winkel sieht größer aus als ein rechter. Du liest an den zwei Skalen 50° und 130° ab. Welcher Wert gehört zum
          Winkel? Antwort: 130°, denn der Winkel ist stumpf, also größer als 90°.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Winkel messen und zeichnen** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/winkel-messen/) nach."
  - type: section
    id: grundfiguren-eben
    title: Ebene Grundfiguren
    blocks:
      - type: definition
        term: Dreieck
        explanation: "Eine Figur mit drei Ecken A, B, C, drei Seiten a, b, c und drei Winkeln α, β, γ. Die Seite a liegt der Ecke A gegenüber. Beispiel: Ein Dreieck mit den Seiten 3 cm, 4 cm und 5 cm."
      - type: definition
        term: Gleichschenkliges Dreieck
        explanation: "Ein Dreieck mit zwei gleich langen Seiten, den Schenkeln. Die dritte Seite heißt Basis. Die beiden Winkel an der Basis sind die Basiswinkel, sie sind gleich groß. Beispiel: Schenkel 5 cm und 5 cm, Basis 6 cm, beide Basiswinkel gleich groß (etwa 53°)."
      - type: definition
        term: Kreis
        explanation: "Alle Punkte, die von einem Punkt, dem Mittelpunkt M, gleich weit entfernt sind. Beispiel: Alle Punkte mit 4 cm Abstand von M bilden einen Kreis."
      - type: definition
        term: Radius
        explanation: "Die Strecke vom Mittelpunkt zu einem Punkt auf dem Kreis, oder ihre Länge. Beispiel: Radius 4 cm."
      - type: definition
        term: Durchmesser
        explanation: "Eine Strecke durch den Mittelpunkt von einem Punkt des Kreises zum gegenüberliegenden, doppelt so lang wie der Radius. Beispiel: Radius 4 cm, Durchmesser 8 cm."
      - type: vue-component
        id: test-kreis
        component: Kurztest
        props:
          question: Ein Kreis hat den Radius 3 cm. Wie lang ist sein Durchmesser?
          options:
            - {
                text: "1,5 cm",
                correct: false,
                info: "Das wäre die Hälfte des Radius. Der Durchmesser ist größer als der Radius.",
              }
            - { text: "6 cm", correct: true, info: "Der Durchmesser ist doppelt so lang wie der Radius: 2 · 3 cm." }
            - {
                text: "9 cm",
                correct: false,
                info: "Das ist das Dreifache des Radius. Der Durchmesser ist das Doppelte.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Kreis hat den Radius 3 cm. Wie lang ist sein Durchmesser? 1,5 cm, 6 cm oder 9 cm. Antwort: 6 cm, denn der
          Durchmesser ist doppelt so lang wie der Radius.
      - type: vue-component
        id: test-gleichschenklig
        component: Kurztest
        props:
          question: In einem gleichschenkligen Dreieck ist ein Basiswinkel 55° groß. Wie groß ist der andere Basiswinkel?
          options:
            - { text: "35°", correct: false, info: "Die Basiswinkel sind gleich groß, nicht Ergänzungen zu 90°." }
            - {
                text: 55°,
                correct: true,
                info: "Die beiden Basiswinkel eines gleichschenkligen Dreiecks sind gleich groß.",
              }
            - { text: "125°", correct: false, info: "Dieser Wert ergänzt 55° zu 180°. Das gilt hier nicht." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: In einem gleichschenkligen Dreieck ist ein Basiswinkel 55° groß. Wie groß ist der andere Basiswinkel? 35°, 55°
          oder 125°. Antwort: 55°, denn die Basiswinkel sind gleich groß.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Ebene Grundfiguren** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/grundfiguren-eben/) nach."
  - type: section
    id: konstruktionen
    title: Zeichnen und Konstruieren
    blocks:
      - type: text
        text: "Zwei Linien sind **parallel**, wenn sie überall denselben Abstand haben und sich nie schneiden. Beispiel: Die Längsseiten eines Rechtecks. Du zeichnest sie mit dem Geodreieck. Ein **rechter Winkel** hat 90°."
      - type: definition
        term: Senkrecht
        explanation: "Zwei Linien stehen senkrecht aufeinander, wenn sie einen rechten Winkel bilden (90°). Beispiel: Die Seiten eines Rechtecks in einer Ecke."
      - type: definition
        term: Lot
        explanation: "Die Senkrechte von einem Punkt auf eine Gerade. Beispiel: Von einem Punkt 3 cm über einer Geraden fällst du das Lot. Es trifft die Gerade senkrecht, der Abstand des Punktes von der Geraden ist 3 cm."
      - type: definition
        term: Mitte einer Strecke
        explanation: "Der Punkt, der die Strecke in zwei gleich lange Teile teilt. Beispiel: Bei einer Strecke von 8 cm ist die Mitte 4 cm von jedem Ende entfernt. Du findest sie, indem du die Strecke misst, die Länge halbierst und vom Ende aus abträgst."
      - type: text
        text: Mit dem **Zirkel** zeichnest du einen Kreis um einen Punkt mit einem Radius, den du vorher an einer Strecke abgegriffen hast.
      - type: vue-component
        id: test-mitte
        component: Kurztest
        props:
          question: Die Strecke AB ist 10 cm lang. Wie weit ist ihre Mitte M von A entfernt?
          options:
            - { text: "5 cm", correct: true, info: "Die Mitte teilt die Strecke in zwei gleiche Teile: 10 cm : 2." }
            - { text: "10 cm", correct: false, info: "So weit ist B von A entfernt, nicht die Mitte." }
            - { text: "20 cm", correct: false, info: "Das ist doppelt so lang wie die ganze Strecke." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Die Strecke AB ist 10 cm lang. Wie weit ist ihre Mitte M von A entfernt? 5 cm, 10 cm oder 20 cm. Antwort: 5 cm,
          denn die Mitte teilt die Strecke in zwei gleiche Teile.
      - type: vue-component
        id: test-lot
        component: Kurztest
        props:
          question: Du fällst von einem Punkt P das Lot auf die Gerade g. Wie liegt die Linie zu g?
          options:
            - { text: "parallel", correct: false, info: "Parallele Linien schneiden sich nie, das Lot trifft g aber." }
            - {
                text: "senkrecht",
                correct: true,
                info: "Das Lot ist die Senkrechte von P auf g und bildet mit g einen rechten Winkel.",
              }
            - { text: "schräg", correct: false, info: "Das Lot steht nicht schräg, es bildet einen rechten Winkel." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Du fällst von einem Punkt P das Lot auf die Gerade g. Wie liegt die Linie zu g? Parallel, senkrecht oder schräg.
          Antwort: senkrecht, das Lot bildet mit g einen rechten Winkel.
      - type: text
        text: "Wenn du unsicher warst: Lies den Baustein **Zeichnen und Konstruieren** auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/konstruktionen/) nach."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - **Winkel messen und zeichnen:** Du kannst einen Winkel messen, zeichnen und sagen, ob er spitz, recht, stumpf oder gestreckt ist.
          - **Ebene Grundfiguren:** Du kennst Dreieck, gleichschenkliges Dreieck und Kreis mit Radius und Durchmesser.
          - **Zeichnen und Konstruieren:** Du kannst eine Parallele und ein Lot zeichnen und die Mitte einer Strecke finden.
